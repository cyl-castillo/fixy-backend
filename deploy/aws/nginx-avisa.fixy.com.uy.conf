# Avisá (https://avisa.fixy.com.uy): web de reclamos vecinales, SPA estática
# (repo avisa-app) que habla con la API de Fixy (https://api.fixy.com.uy).
# TLS lo pone Cloudflare (túnel cloudflared-fixy); acá solo :80.
# Se aplica con:
#   LOCAL_CONF=deploy/aws/nginx-avisa.fixy.com.uy.conf \
#   REMOTE_CONF_NAME=avisa.fixy.com.uy.conf ./deploy/aws/apply-nginx.sh
server {
    listen 80;
    server_name avisa.fixy.com.uy;

    root /var/www/avisa-app/current;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    # Security headers básicos (geolocation=(self): "Usar mi ubicación" en /reportar)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self)" always;

    # Assets versionados (Vite usa hash en filename) → cache 1 año, immutable.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Favicon e iconos: cache moderado.
    location ~ ^/(favicon\.[a-z]+|icons\.svg|manifest\.webmanifest|apple-touch-icon\.png)$ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # SPA shell: NO cachear, así un release nuevo se ve rápido.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Preview de reclamos (mismo patrón que /barrio/r/ en la conf www): /r/{id}
    # lo comparten por WhatsApp/Facebook; los bots no ejecutan JS y necesitan el
    # shell con OG reales (BarrioOgController, siempre 200). Si el backend no
    # responde, cae al shell de la SPA.
    location ~ ^/r/\d+$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        proxy_intercept_errors on;
        error_page 502 503 504 = /index.html;

        proxy_pass http://127.0.0.1:8080/og/barrio$uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Todo lo demás: archivo estático real o shell de la SPA (router cliente:
    # /, /reportar, /r/:id y su 404 amable).
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri /index.html;
    }
}
