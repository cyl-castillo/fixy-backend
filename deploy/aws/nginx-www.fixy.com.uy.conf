server {
    listen 80;
    server_name fixy.com.uy www.fixy.com.uy;

    root /var/www/fixy-app/current;
    index index.html;

    # Apex → www conservando la ruta (Tier 1, informe 02: el redirect de
    # Cloudflare tiraba a la home y perdía /casa-a-distancia, /servicios/...
    # — un QR o un link compartido sin www caía siempre en la portada).
    # Cloudflare responde antes que nosotros cuando el proxy está activo, así
    # que la regla de Cloudflare también se corrige (TIER1_ACCIONES_CARLOS.md);
    # esta línea cubre el caso de tráfico directo.
    if ($host = fixy.com.uy) {
        return 301 https://www.fixy.com.uy$request_uri;
    }

    # 404 real (Tier 1): antes toda ruta devolvía 200 con el shell de la app
    # (soft-404) y Google/las IA indexaban basura. El fallback a index.html
    # queda SOLO para las rutas que la app resuelve; lo demás es 404 con una
    # página estática de marca.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Compresión (Cloudflare puede recomprimir, pero es bueno
    # tenerlo en origen por si alguien va directo).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    # Security headers básicos
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self)" always;

    # Assets versionados (Vite usa hash en filename) → cache 1 año, immutable.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Favicon e iconos: cache moderado.
    location = /favicon.svg {
        add_header Cache-Control "public, max-age=86400" always;
    }
    location = /icons.svg {
        add_header Cache-Control "public, max-age=86400" always;
    }

    # SPA shell: NO cachear, así un release nuevo se ve rápido.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri /index.html;
    }

    # Páginas estáticas servicio+zona (Tier 1): HTML generado en el build en
    # dist/servicios/<slug>/index.html, sin React. Cache corto: cambian solo
    # con un release.
    location /servicios/ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri $uri/ =404;
    }

    # Rutas de la app (router casero de src/App.tsx): SOLO estas caen al
    # shell. Cualquier otra ruta es 404 de verdad (ver error_page arriba).
    location ~ ^/(c|p|consulta|mi-casa|mi-comercio)/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }
    location ~ ^/(panel|mi-negocio|mi-comercio|publicar-oferta|sumate|admin|terminos|privacidad|casa-a-distancia|ofertas)(/.*)?$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    # Todo lo demás: archivo estático real (manifest, robots, llms.txt,
    # .well-known, iconos) o 404.
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    # Proxy a backend (path /api/*).
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Preview de ofertas para bots de WhatsApp/Meta: esos bots NO ejecutan
    # JS, así que un link compartido de /oferta/{id} caería en el fallback
    # SPA de abajo y verían el index.html genérico (título/imagen de Fixy,
    # no de la oferta). Interceptamos la ruta ANTES del fallback y la
    # mandamos al backend, que devuelve el mismo shell pero con los meta
    # tags Open Graph de la oferta real inyectados (OfferOgController,
    # contrato: siempre 200 aunque la oferta no exista/no esté vigente).
    # Sin cache: el contenido depende de la oferta pedida.
    # Si el backend no responde, la página del vecino NO puede caerse:
    # proxy_intercept_errors + error_page cae al shell SPA de siempre (el
    # backend caído solo le cuesta el preview del bot ese rato, no la app).
    location ~ ^/oferta/\d+$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        proxy_intercept_errors on;
        error_page 502 503 504 = /index.html;

        proxy_pass http://127.0.0.1:8080/og$uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Preview de la página pública del comercio (Fase 3, mismo motivo que
    # /oferta/ arriba): bots de WhatsApp/Meta y crawlers no ejecutan JS, así
    # que /comercio/{slug} necesita el shell con OG + JSON-LD LocalBusiness
    # inyectados server-side (BusinessOgController). Mismo fallback a SPA si
    # el backend no responde.
    location ~ ^/comercio/[a-z0-9-]+$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        proxy_intercept_errors on;
        error_page 502 503 504 = /index.html;

        proxy_pass http://127.0.0.1:8080/og$uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Proxy a GoatCounter (panel + tracking script + count endpoint).
    # OJO: este bloque existía solo a mano en el server (fixy-web.conf,
    # 13/08) — al consolidar a esta conf versionada tiene que venir con
    # nosotros o se rompe la analítica (offers-tab-view, digest-open, etc).
    location /stats/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Sitemap dinámico (SEO): lo arma el backend con las ofertas vigentes
    # en cada request (GET /sitemap.xml, ver SitemapController) — nginx
    # solo proxea, sin cache (mismo motivo que /oferta/: contenido dinámico).
    location = /sitemap.xml {
        add_header Cache-Control "no-cache, must-revalidate" always;
        proxy_pass http://127.0.0.1:8080/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
