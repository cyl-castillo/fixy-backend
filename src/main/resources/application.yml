server:
  port: ${PORT:8080}

spring:
  application:
    name: fixy-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/fixy;MODE=PostgreSQL;AUTO_SERVER=TRUE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      # Default `update` = dev local con H2 (autocrea el esquema, Flyway off).
      # PROD DEBE OVERRIDEAR A `none` en /etc/fixy-backend.env: prod es
      # Postgres + Flyway (dueño del esquema). En prod, `update` es un no-op
      # ROTO — intenta re-crear tablas existentes en cada boot (tormenta de
      # warnings) y NO altera nada, así que una entidad con columnas nuevas
      # deployada SIN migración rompe prod (incidente 2026-07-22). Todo
      # cambio de esquema = migración en db/migration. Ver también los tests
      # (create-drop explícito) que no dependen de este default.
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        dialect: ${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
  h2:
    console:
      enabled: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Schema baseline (Postgres prod 2026-05-11)"
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

fixy:
  uploads:
    dir: ${FIXY_UPLOADS_DIR:./data/uploads}
    url-prefix: ${FIXY_UPLOADS_URL_PREFIX:/uploads}
  security:
    username: ${FIXY_OPS_USERNAME:ops}
    password: ${FIXY_OPS_PASSWORD:change-me}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5-mini}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
    model: ${OLLAMA_MODEL:qwen2.5:3b}
  cloudflare:
    account-id: ${CF_ACCOUNT_ID:}
    api-token: ${CF_API_TOKEN:}
    model: ${CF_MODEL:@cf/meta/llama-3.3-70b-instruct-fp8-fast}
  whatsapp:
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    api-version: ${WHATSAPP_API_VERSION:v21.0}
    webhook-verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    template-name: ${WHATSAPP_TEMPLATE_NAME:provider_lead_notification}
    template-lang: ${WHATSAPP_TEMPLATE_LANG:es}
  agent:
    enabled: ${FIXY_AGENT_ENABLED:true}
    provider: ${FIXY_AGENT_PROVIDER:openai}
  payments:
    enabled: ${FIXY_PAYMENTS_ENABLED:false}
    commission-percent: ${FIXY_COMMISSION_PERCENT:10}
    mp-access-token: ${MP_ACCESS_TOKEN:}
    mp-webhook-secret: ${MP_WEBHOOK_SECRET:}
    webhook-base-url: ${FIXY_WEBHOOK_BASE_URL:}
  closing:
    enabled: ${FIXY_CLOSING_ENABLED:true}
    auto-confirm-hours: ${FIXY_CLOSING_AUTO_CONFIRM_HOURS:72}
    scheduler-fixed-delay-ms: ${FIXY_CLOSING_SCHEDULER_FIXED_DELAY_MS:3600000}
  collections:
    enabled: ${FIXY_COLLECTIONS_ENABLED:true}
    overdue-days: ${FIXY_COLLECTIONS_OVERDUE_DAYS:7}
    scheduler-fixed-delay-ms: ${FIXY_COLLECTIONS_SCHEDULER_FIXED_DELAY_MS:3600000}
  auth:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    session-secret: ${AUTH_SESSION_SECRET:}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
  push:
    vapid-public-key: ${FIXY_PUSH_VAPID_PUBLIC_KEY:}
    vapid-private-key: ${FIXY_PUSH_VAPID_PRIVATE_KEY:}
    subject: ${FIXY_PUSH_SUBJECT:mailto:soporte@fixy.com.uy}
