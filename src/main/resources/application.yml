server:
  port: ${PORT:8080}

spring:
  application:
    name: fixy-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/fixy;MODE=PostgreSQL;AUTO_SERVER=TRUE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        dialect: ${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
  h2:
    console:
      enabled: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Schema baseline (Postgres prod 2026-05-11)"
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

fixy:
  uploads:
    dir: ${FIXY_UPLOADS_DIR:./data/uploads}
    url-prefix: ${FIXY_UPLOADS_URL_PREFIX:/uploads}
  security:
    username: ${FIXY_OPS_USERNAME:ops}
    password: ${FIXY_OPS_PASSWORD:change-me}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4.1-mini}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
    model: ${OLLAMA_MODEL:qwen2.5:3b}
  agent:
    enabled: ${FIXY_AGENT_ENABLED:true}
    provider: ${FIXY_AGENT_PROVIDER:openai}
