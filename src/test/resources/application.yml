spring:
  datasource:
    # Base ÚNICA POR CONTEXTO de Spring (${random.uuid}): antes todos los
    # contextos compartían jdbc:h2:mem:fixytest y cada contexto nuevo hacía
    # create-drop sobre la base del anterior MIENTRAS sus schedulers seguían
    # vivos — la raíz de los flakes de interferencia (TelegramNotifyService
    # re-notificando con seeds ajenos, ProviderOpportunityController con
    # listas vacías según el ORDEN de ejecución: local rojo / CI verde).
    url: jdbc:h2:mem:fixytest-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: false

fixy:
  # Schedulers de fondo APAGADOS en tests (lección ya aprendida y re-aprendida:
  # memoria "interferencia entre contextos" + corrida roja 2026-08-06): un
  # @Scheduled sin initialDelay dispara al arrancar CADA contexto — el retry
  # de huérfanos asignaba el lead del test al proveedor antes de que el test
  # mirara la bandeja (rojo local, verde CI: depende del caché de contextos).
  # Los tests que los prueban los instancian a mano con enabled=true.
  orphan-match-retry:
    enabled: false
  reengagement:
    enabled: false
  security:
    username: test-ops
    password: test-pass
  openai:
    api-key: ""
    model: gpt-4.1-mini
  agent:
    enabled: false
  abuse:
    max-requests-per-window: 200
    window-seconds: 60
  chat:
    max-messages-per-window: 100
    window-seconds: 60
  payments:
    enabled: true
    commission-percent: 10
    mp-access-token: ""
    mp-webhook-secret: ""
  closing:
    enabled: false
    auto-confirm-hours: 72
    scheduler-fixed-delay-ms: 3600000
  collections:
    enabled: false
    overdue-days: 7
    scheduler-fixed-delay-ms: 3600000
  offers:
    expiration:
      enabled: false
      scheduler-fixed-delay-ms: 3600000
  auth:
    google-client-id: test-client-id.apps.googleusercontent.com
    session-secret: test-session-secret-at-least-32-bytes-long-for-hmac
